name: jal_drishti
description: >
  Jal Drishti — Offline-first emergency-response app for
  Uttarakhand flash-flood environments.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Technology Contract (TAD Section 3) ───────────────────
  # State Management
  signals_flutter: ^7.1.0

  # Map rendering & PMTiles
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Database & Local Storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  flutter_secure_storage: ^11.0.0

  # BLE Mesh
  flutter_reactive_ble: 5.4.1
  permission_handler: ^13.0.2

  # Hardware SOS
  torch_light: ^2.0.0
  audioplayers: ^6.8.1
  telephony: ^0.2.0

  # Location & UI
  geolocator: ^14.0.3
  cupertino_icons: ^1.0.8
  uuid: ^4.5.1
  intl: ^0.19.0

  # Text to Speech
  flutter_tts: ^4.2.5
  flutter_map_pmtiles: ^1.0.5
  pmtiles: ^1.3.0
  flutter_map_tile_caching: ^9.1.0
  http: ^1.6.0
  battery_plus: ^6.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpeg
    - assets/images/logo.png
    - assets/images/logoWithoutText.png
    - assets/data/emergency_directory.json
    - assets/data/sos_canned_messages.json
    - assets/data/medical_qa.json
    - assets/data/state_capitals.json
    - assets/data/uttarakhand_hospitals.json
    - assets/data/uttarakhand_rivers.json
    - assets/data/uttarakhand_shelters.json
    - assets/data/uttarakhand_boundaries.json
    - assets/data/uttarakhand_helipads.json
    - assets/data/uttarakhand_roads.json
    - assets/data/uttarakhand_poi_search.json
    - assets/audio/siren.wav
    - assets/admin_canned_messages.json
